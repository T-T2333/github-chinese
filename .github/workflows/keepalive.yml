name: Keepalive

on:
  schedule:
    - cron: '23 4 1 */3 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    if: github.repository == 'T-T2333/github-chinese'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages

      - name: Create empty keepalive commit
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit --allow-empty -m "chore: keepalive at $(date -u +'%Y-%m-%d')"

          git push origin "HEAD:gh-pages"